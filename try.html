            background: var(--slate-100);
            color: var(--slate-600);

            border-bottom: 1px solid var(--slate-100);

            font-weight: bold;

            color: var(--teal-600);

            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
    </style>

</div>

<script>

let wordData = []; 
let chart;
let mathArrowData = null;

// 2. PCA 主成分分析降維演算法
function computePCA(data) {
    const matrix = data.map(d => d.vector);
    const numRows = matrix.length;
    const numCols = matrix[0].length;

    const means = Array(numCols).fill(0);
    for (let j = 0; j < numCols; j++) {
        for (let i = 0; i < numRows; i++) means[j] += matrix[i][j];
        means[j] /= numRows;
    }
    const centered = matrix.map(row => row.map((val, j) => val - means[j]));

    function extractPrincipalComponent(matrixData, maxIter = 150) {
        let vec = Array(numCols).fill(0).map(() => Math.random() - 0.5);
        let norm = Math.sqrt(vec.reduce((sum, v) => sum + v*v, 0));
        vec = vec.map(v => v / norm);

        for (let iter = 0; iter < maxIter; iter++) {
            let nextVec = Array(numCols).fill(0);
            for (let i = 0; i < numRows; i++) {
                let dot = 0;
                for (let j = 0; j < numCols; j++) dot += matrixData[i][j] * vec[j];
                for (let j = 0; j < numCols; j++) nextVec[j] += matrixData[i][j] * dot;
            }
            let nextNorm = Math.sqrt(nextVec.reduce((sum, v) => sum + v*v, 0));
            if(nextNorm === 0) break;
            vec = nextVec.map(v => v / nextNorm);
        }
        return vec;
    }

    const pc1 = extractPrincipalComponent(centered);
    const residual = centered.map(row => {
        let dot = row.reduce((sum, val, j) => sum + val * pc1[j], 0);
        return row.map((val, j) => val - dot * pc1[j]);
    });
    const pc2 = extractPrincipalComponent(residual);

    let projected = data.map((item, idx) => {
        let x = centered[idx].reduce((sum, val, j) => sum + val * pc1[j], 0);
        let y = centered[idx].reduce((sum, val, j) => sum + val * pc2[j], 0);
        return { ...item, rawX: x, rawY: y };
    });

    const minX = Math.min(...projected.map(p => p.rawX));
    const maxX = Math.max(...projected.map(p => p.rawX));
    const minY = Math.min(...projected.map(p => p.rawY));
    const maxY = Math.max(...projected.map(p => p.rawY));

    return projected.map(p => ({
        ...p,
        x: 1.5 + ((p.rawX - minX) / (maxX - minX || 1)) * 9,
        y: 1.5 + ((p.rawY - minY) / (maxY - minY || 1)) * 9
    }));
}

// 3. 餘弦相似度計算
function cosineSimilarity(vecA, vecB) {
    let dotProduct = 0, normA = 0, normB = 0;
    for (let i = 0; i < vecA.length; i++) {
        dotProduct += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
    }
    if (normA === 0 || normB === 0) return 0;
    return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
}

// 4. 初始化 Chart.js 圖表結構與幾何拓撲
function initChart() {
    const ctx = document.getElementById('wordChart').getContext('2d');
    
    chart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'Latent Semantic Manifold Projection (PCA Plane)',
                data: wordData.map(d => ({ x: d.x, y: d.y })),
                backgroundColor: wordData.map(d => d.color),
                pointRadius: 9,
                pointHoverRadius: 12,
                borderWidth: 1.5,
                borderColor: '#ffffff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { min: 0, max: 12, title: { display: true, text: 'Principal Component 1 (Eigenaxis 1)' }, grid: { color: '#f1f5f9' } },
                y: { min: 0, max: 12, title: { display: true, text: 'Principal Component 2 (Eigenaxis 2)' }, grid: { color: '#f1f5f9' } }
            },
            plugins: {
                legend: { display: false }
            },
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    mathArrowData = null;
                    updateAnalysisUI(wordData[index].word, wordData[index].vector);
                }
            }
        },
        plugins: [{
            id: 'academicGeometryEngine',
            afterDatasetsDraw(chart) {
                const {ctx, scales: {x, y}} = chart;
                ctx.save();
                
                wordData.forEach(d => {
                    ctx.font = '500 12px sans-serif';
                    ctx.fillStyle = '#475569';
                    ctx.fillText(d.word, x.getPixelForValue(d.x) + 14, y.getPixelForValue(d.y) + 4);
                });

                if (document.getElementById('showAnalogylines').checked) {
                    ctx.lineWidth = 1.2;
                    ctx.setLineDash([4, 4]);
                    drawVectorArrow(ctx, x, y, findWord("國王"), findWord("男人"), '#ef4444');
                    drawVectorArrow(ctx, x, y, findWord("女王"), findWord("女人"), '#ec4899');
                    drawVectorArrow(ctx, x, y, findWord("東京"), findWord("日本"), '#20b2aa');
                    drawVectorArrow(ctx, x, y, findWord("華盛頓"), findWord("美國"), '#2e8b57');
                    drawVectorArrow(ctx, x, y, findWord("蘋果"), findWord("iPhone"), '#a52a2a');
                    drawVectorArrow(ctx, x, y, findWord("微軟"), findWord("Windows"), '#8b008b');
                    drawVectorArrow(ctx, x, y, findWord("黃金"), findWord("Au"), '#d4af37');
                    drawVectorArrow(ctx, x, y, findWord("銅"), findWord("Cu"), '#b87333');
                }

                if (document.getElementById('showMathArrow').checked && mathArrowData) {
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([]);
                    
                    drawVectorArrow(ctx, x, y, mathArrowData.ptA, mathArrowData.ptAMinusB, '#2563eb', true);
                    drawVectorArrow(ctx, x, y, mathArrowData.ptAMinusB, mathArrowData.ptResult, '#10b981', true);

                    const targetX = x.getPixelForValue(mathArrowData.ptResult.x);
                    const targetY = y.getPixelForValue(mathArrowData.ptResult.y);
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    
                    ctx.font = 'bold 11px monospace';
                    ctx.fillStyle = '#0f172a';
                    ctx.fillText(" 🎯 Calculated Node (Theory)", targetX + 10, targetY - 6);
                }
                ctx.restore();
            }
        }]
    });
}

function drawVectorArrow(ctx, scaleX, scaleY, pt1, pt2, color, isDashed=false) {
    if (!pt1 || !pt2) return;
    const x1 = scaleX.getPixelForValue(pt1.x);
    const y1 = scaleY.getPixelForValue(pt1.y);
    const x2 = scaleX.getPixelForValue(pt2.x);
    const y2 = scaleY.getPixelForValue(pt2.y);
    
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.setLineDash(isDashed ? [3, 3] : []);
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 8 * Math.cos(angle - Math.PI / 6), y2 - 8 * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - 8 * Math.cos(angle + Math.PI / 6), y2 - 8 * Math.sin(angle + Math.PI / 6));
    ctx.fill();
}

function findWord(name) {
    return wordData.find(d => d.word === name);
}

// 6. 更新計量分析面板 (Embedding Metrics)
function updateAnalysisUI(titleText, targetVector, highlightWord = null) {
    document.getElementById('selected-title').innerText = `Target: ${titleText}`;
    const vecDisplay = document.getElementById('vector-display');
    const vecRaw = document.getElementById('vector-raw');
    vecDisplay.style.display = 'block';

    const latentDimensions = [
        "Royalty(皇室權力)", "Masculinity(陽性)", "Feminity(陰性)", "Biological(生物屬性)",
        "Geography(地理歸屬)", "TechScience(抽象科技)", "Liquid(液態物質)", "SolidFood(固態食物)"
    ];
    let matrixHtml = `<div style='font-weight:bold; margin-bottom:6px; color:#334155;'>Distributed Feature Weights Matrix (8-Dimensions):</div>`;
    targetVector.forEach((v, idx) => {
        matrixHtml += `<div class="matrix-row">
            <span class="matrix-dim">Dim ${idx+1} [${latentDimensions[idx]}]:</span>
            <span class="matrix-val">${v.toFixed(4)}</span>
        </div>`;
    });
    vecRaw.innerHTML = matrixHtml;

    const results = wordData.map(d => ({
        word: d.word,
        similarity: cosineSimilarity(targetVector, d.vector)
    }));
    results.sort((a, b) => b.similarity - a.similarity);

    const tbody = document.getElementById('similarity-results-tbody');
    tbody.innerHTML = '';
    results.forEach(res => {
        const tr = document.createElement('tr');
        if (res.word === highlightWord) {
            tr.classList.add('highlight-row');
        }
        tr.innerHTML = `
            <td><strong>${res.word}</strong></td>
            <td><span class="cosine-badge">${res.similarity.toFixed(5)}</span></td>
        `;
        tbody.appendChild(tr);
    });
}

// 7. 幾何代數運算核心： A - B + C
function calculateAnalogy() {
    const wordA = document.getElementById('algA').value;
    const wordB = document.getElementById('algB').value;
    const wordC = document.getElementById('algC').value;

    const objA = wordData.find(d => d.word === wordA);
    const objB = wordData.find(d => d.word === wordB);
    const objC = wordData.find(d => d.word === wordC);

    const resultVector = [];
    for (let i = 0; i < objA.vector.length; i++) {
        resultVector.push(objA.vector[i] - objB.vector[i] + objC.vector[i]);
    }

    const simulatedPtResult = {
        x: objA.x - objB.x + objC.x,
        y: objA.y - objB.y + objC.y
    };
    const simulatedPtAMinusB = {
        x: objA.x - objB.x,
        y: objA.y - objB.y
    };

    mathArrowData = {
        ptA: objA,
        ptAMinusB: simulatedPtAMinusB,
        ptResult: simulatedPtResult
    };

    let bestWord = "";
    let maxSim = -2;
    wordData.forEach(d => {
        if(d.word !== wordA && d.word !== wordC) {
            let sim = cosineSimilarity(resultVector, d.vector);
            if(sim > maxSim) {
                maxSim = sim;
                bestWord = d.word;
            }
        }
    });

    document.getElementById('showMathArrow').checked = true;
    chart.update();

    updateAnalysisUI(`[${wordA} - ${wordB} + ${wordC}]`, resultVector, bestWord);
}

function toggleLines() {
    chart.update();
}

function searchWord() {
    const input = document.getElementById('searchWord').value.trim();
    const foundIndex = wordData.findIndex(d => d.word === input);
    
    if (foundIndex !== -1) {
        mathArrowData = null;
        updateAnalysisUI(wordData[foundIndex].word, wordData[foundIndex].vector);
        chart.setActiveElements([{ datasetIndex: 0, index: foundIndex }]);
        chart.update();
    } else {
        alert("查詢詞彙不存於目前的模擬詞典（Vocabulary）中！");
    }
}

function initSelectors() {
    const selectors = ['algA', 'algB', 'algC'];
    selectors.forEach(id => {
        const el = document.getElementById(id);
        rawWordData.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.word;
            opt.innerText = d.word;
            el.appendChild(opt);
        });
    });
    
    document.getElementById('algA').value = "東京";
    document.getElementById('algB').value = "日本";
    document.getElementById('algC').value = "美國";
}

window.onload = () => {
    wordData = computePCA(rawWordData);
    initSelectors();
    initChart();
};
</script>
