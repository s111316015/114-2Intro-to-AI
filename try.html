<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word2Vec 2D 詞向量互動視覺化</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-align: center;
        }
        p.desc {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }
        .control-panel {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
        .control-panel input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }
        .control-panel button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .control-panel button:hover {
            background-color: #2563eb;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .chart-box {
            position: relative;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
        }
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .info-box h3 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .similarity-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        .similarity-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .score {
            font-family: monospace;
            font-weight: bold;
            color: #0d9488;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Word2Vec 2D 空間幾何與語意互動網頁</h1>
    <p class="desc">利用高維詞向量降維至 2D 的模擬視覺化。點擊圖中單字可觀察相似度，或勾選顯示語意平行關係。</p>

    <div class="control-panel">
        <div>
            <label for="searchWord">搜尋單字：</label>
            <input type="text" id="searchWord" placeholder="例如：國王, 貓...">
            <button onclick="searchWord()">搜尋</button>
        </div>
        <div>
            <input type="checkbox" id="showLines" onchange="toggleLines()">
            <label for="showLines"><strong>顯示語意類比連線</strong> (國王-男人 vs 女王-女人)</label>
        </div>
    </div>

    <div class="main-layout">
        <div class="chart-box">
            <canvas id="wordChart" style="width:100%; height:450px;"></canvas>
        </div>

        <div class="info-box">
            <h3 id="selected-title">點擊圖中單字</h3>
            <p>與該詞在多維空間中的<strong>餘弦相似度 (Cosine Similarity)</strong> 排行：</p>
            <ul id="similarity-results" class="similarity-list">
                <li style="color: #94a3b8;">暫無資料，請點擊左側散佈圖節點</li>
            </ul>
        </div>
    </div>
</div>

<script>
// 1. 模擬 Word2Vec 資料（包含 2D 繪圖座標，與背後用於計算相似度的 4 維模擬主向量）
const wordData = [
    { word: "國王", x: 2,  y: 8,  vector: [0.9, 0.1, 0.8, 0.2], color: "#ef4444" },
    { word: "女王", x: 4,  y: 9,  vector: [0.8, 0.2, 0.2, 0.9], color: "#ec4899" },
    { word: "男人", x: 1.5,y: 4,  vector: [0.7, 0.1, 0.7, 0.1], color: "#3b82f6" },
    { word: "女人", x: 3.5,y: 5,  vector: [0.6, 0.2, 0.1, 0.8], color: "#10b981" },
    { word: "王子", x: 2.5,y: 7.2,vector: [0.85,0.15,0.75,0.25],color: "#f59e0b" },
    { word: "公主", x: 4.5,y: 8.1,vector: [0.75,0.25,0.15,0.85],color: "#8b5cf6" },
    { word: "貓",   x: 8,  y: 2,  vector: [0.1, 0.9, 0.3, 0.6], color: "#64748b" },
    { word: "狗",   x: 9,  y: 1.5,vector: [0.15,0.85,0.4, 0.5], color: "#64748b" },
    { word: "小丑", x: 6,  y: 5,  vector: [0.4, 0.5, 0.5, 0.5], color: "#64748b" }
];

// 2. 餘弦相似度計算函數 (Cosine Similarity)
function cosineSimilarity(vecA, vecB) {
    let dotProduct = 0;
    let normA = 0;
    let normB = 0;
    for (let i = 0; i < vecA.length; i++) {
        dotProduct += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
    }
    return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
}

let chart;

// 3. 初始化 Chart.js 散佈圖
function initChart() {
    const ctx = document.getElementById('wordChart').getContext('2d');
    
    chart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: '詞向量空間',
                data: wordData.map(d => ({ x: d.x, y: d.y })),
                backgroundColor: wordData.map(d => d.color),
                pointRadius: 9,
                pointHoverRadius: 12
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return wordData[context.dataIndex].word;
                        }
                    }
                },
                // 在畫布上直接繪製文字標籤與類比連線
                afterDraw: (chart) => {} 
            },
            scales: {
                x: { min: 0, max: 11, title: { display: true, text: '降維特徵 X' } },
                y: { min: 0, max: 11, title: { display: true, text: '降維特徵 Y' } }
            },
            // 監聽點擊事件
            onClick: (event, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    updateSimilarityUI(wordData[index]);
                }
            }
        },
        // 利用 Chart.js 套件外掛機制手動繪製文字與連線
        plugins: [{
            id: 'customLabels',
            afterDatasetsDraw(chart) {
                const {ctx, scales: {x, y}} = chart;
                ctx.save();
                
                // 畫文字標籤
                wordData.forEach(d => {
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillStyle = '#1e293b';
                    ctx.fillText(d.word, x.getPixelForValue(d.x) + 12, y.getPixelForValue(d.y) + 4);
                });

                // 如果勾選，畫出語意類比連線 (國王->男人, 女王->女人)
                if (document.getElementById('showLines').checked) {
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    
                    // 連線1：國王 到 男人
                    drawLine(ctx, x, y, wordData[0], wordData[2], '#3b82f6');
                    // 連線2：女王 到 女人
                    drawLine(ctx, x, y, wordData[1], wordData[3], '#ec4899');
                }
                ctx.restore();
            }
        }]
    });
}

function drawLine(ctx, scaleX, scaleY, pt1, pt2, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.moveTo(scaleX.getPixelForValue(pt1.x), scaleY.getPixelForValue(pt1.y));
    ctx.lineTo(scaleX.getPixelForValue(pt2.x), scaleY.getPixelForValue(pt2.y));
    ctx.stroke();
}

// 4. 計算並更新右側互動資訊欄
function updateSimilarityUI(targetWordObj) {
    document.getElementById('selected-title').innerText = `目前選取：${targetWordObj.word}`;
    
    // 計算與所有詞的相似度
    const results = wordData.map(d => {
        return {
            word: d.word,
            similarity: cosineSimilarity(targetWordObj.vector, d.vector)
        };
    });

    // 由高到低排序
    results.sort((a, b) => b.similarity - a.similarity);

    // 渲染至網頁上
    const listContainer = document.getElementById('similarity-results');
    listContainer.innerHTML = '';
    results.forEach(res => {
        const li = document.createElement('li');
        // 如果是自己，加粗變色
        if(res.word === targetWordObj.word) {
            li.style.fontWeight = 'bold';
            li.style.color = 'var(--primary)';
        }
        li.innerHTML = `<span>${res.word}</span> <span class="score">${res.similarity.toFixed(4)}</span>`;
        listContainer.appendChild(li);
    });
}

// 5. 控制面板：顯示/隱藏連線
function toggleLines() {
    chart.update();
}

// 6. 控制面板：搜尋功能
function searchWord() {
    const input = document.getElementById('searchWord').value.trim();
    const foundIndex = wordData.findIndex(d => d.word === input);
    
    if (foundIndex !== -1) {
        updateSimilarityUI(wordData[foundIndex]);
        // 模擬 Chart.js 的 hover 效果高亮該點
        chart.setActiveElements([{ datasetIndex: 0, index: foundIndex }]);
        chart.update();
    } else {
        alert("找不到該單字！請試試看：國王、女王、男人、女人、貓、狗");
    }
}

// 啟動
window.onload = initChart;
</script>

</body>
</html>
